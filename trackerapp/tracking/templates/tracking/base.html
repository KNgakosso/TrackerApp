{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block title %}
        TrackAPP
      {% endblock title %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- CSS du projet -->
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
  </head>
  <body class="bg-dark text-light">
    <!-- ==================== NAVBAR ==================== -->
    {% include "tracking/components/_navbar.html" %}
    <!-- ==================== CONTENU ==================== -->
    <main class="container py-4">
      {% block content %}
      {% endblock content %}
    </main>
    <!-- ==================== FOOTER ==================== -->
    <footer class="border-top border-secondary text-center text-secondary py-3 mt-5">
      <small>{% trans "Project protfolio Django" %} • TrackAPP</small>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
