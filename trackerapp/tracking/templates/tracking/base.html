{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block title %}
        TrackAPP
      {% endblock title %}
    </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- CSS du projet -->
    <link rel="stylesheet" href="{% static 'tracking/css/style.css' %}">
  </head>
  <body class="bg-dark text-light">
    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'tracking:index' %}">🎌 TrackAPP</a>
        <!-- Bouton affiché uniquement sur mobile -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Afficher le menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Contenu repliable -->
        <div class="collapse navbar-collapse" id="navbarContent">
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'tracking:index' %}">{% trans "Home" %}</a>
            <a class="nav-link" href="{% url 'tracking:index' %}">{% trans "New search" %}</a>
            <a class="nav-link" href="{% url 'tracking:watchlists' %}">{% trans "Watchlists" %}</a>
            <a class="nav-link" href="{% url 'tracking:finished_medias' %}">{% trans "Completed" %}</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- ==================== CONTENU ==================== -->
    <main class="container py-4">
      {% block content %}
      {% endblock content %}
    </main>
    <!-- ==================== FOOTER ==================== -->
    <footer class="border-top border-secondary text-center text-secondary py-3 mt-5">
      <small>{% trans "Project protfolio Django" %} • TrackAPP</small>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
