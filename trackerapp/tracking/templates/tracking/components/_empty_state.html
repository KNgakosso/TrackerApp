<div class="text-center py-5">
    {% if icon %}
        <div class="display-3 mb-3">{{ icon }}</div>
    {% endif %}
    <h3 class="mb-3">{{ title }}</h3>
    {% if message %}
        <p class="text-muted mb-4">{{ message }}</p>
    {% endif %}
    {% if button_url and button_text %}
        <a href="{{ button_url }}" class="btn btn-primary">{{ button_text }}</a>
    {% endif %}
</div>
