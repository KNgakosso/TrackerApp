<div class="card h-100 shadow-sm">
    <img src="{{ media.images_urls.image_url }}"
         class="card-img-top object-fit-cover"
         width="225"
         height="320"
         alt="{{ media.title }}">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title mb-3">{{ media.title }}</h5>
        <div class="mb-3">
            <span class="badge bg-secondary">{{ media.media_type|title }}</span>
            {% if media.score %}
                <span class="badge bg-warning text-dark">⭐ {{ media.score }}</span>
            {% endif %}
        </div>
        {% if show_progress %}
            <p class="small text-muted mb-3">Progression : {{ media.user_completion }}</p>
        {% endif %}
        <div class="mt-auto">
            <a href="{% url 'tracking:media_details' media.media_type media.mal_id %}"
               class="btn btn-primary w-100">Voir les détails</a>
        </div>
    </div>
</div>
